<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1214">
  <title>Not found · stale</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root{--bg:#0b1214;--accent:#2ee6c7;--muted:#9ab3ad}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--bg);color:var(--accent)}
    body{min-height:100vh;display:flex;flex-direction:column;font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    header{padding:20px}
    .home-mark{display:inline-flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.24em;text-transform:uppercase}
    .home-mark img{width:36px;height:36px;border-radius:9px;display:block}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px 64px}
    .code{font-size:12px;letter-spacing:.3em;color:var(--muted);margin-bottom:12px}
    h1{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:600;line-height:1.2;margin-bottom:24px;max-width:22ch}
    .home{display:inline-block;padding:11px 20px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-weight:600}
    .home:hover,.home:focus-visible{background:var(--accent);color:var(--bg)}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    footer{padding:20px;text-align:center;font-size:13px;color:var(--muted)}
    footer a{color:var(--muted)}
  </style>
</head>
<body>
  <header><a class="home-mark" href="/"><img src="/favicon.svg" alt="" width="36" height="36"><span>stale</span></a></header>
  <main>
    <p class="code">404</p>
    <h1>No such page.</h1>
    <a class="home" href="/">Back to stale</a>
  </main>
  <footer><a href="https://elghaly.dev/">elghaly.dev</a></footer>
</body>
</html>
